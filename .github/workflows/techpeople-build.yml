# [TECHPEOPLE] Build & push the company Superset image to GitHub Container Registry.
# Triggers ONLY on our release tags (e.g. 4.1.1-techpeople.3) so it never clashes
# with the upstream Apache workflows. See tech_docs/FRONTEND_DEV_GUIDE.md.
name: TechPeople build & push image

on:
  push:
    tags:
      - "*-techpeople.*"

# Allow the built-in GITHUB_TOKEN to push packages to ghcr.io — no external secrets needed.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and image name
        # ghcr.io requires the repository name to be lowercase; github.repository
        # keeps the original org casing (e.g. TechPeopleOrg), so force it down.
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # github.actor casing is fine for login; the image name is what ghcr rejects.

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lean # production runtime stage
          push: true
          build-args: |
            BUILD_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          # Frontend build is slow (15-25 min) — caching is mandatory.
          cache-from: type=gha
          cache-to: type=gha,mode=max
